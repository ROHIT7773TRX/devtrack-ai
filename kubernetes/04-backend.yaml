---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtrack-backend
  namespace: devtrack
  labels:
    app: devtrack-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devtrack-backend
  template:
    metadata:
      labels:
        app: devtrack-backend
    spec:
      containers:
        - name: backend
          image: devtrackai/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: devtrack-secret
            - configMapRef:
                name: devtrack-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: devtrack-backend-service
  namespace: devtrack
spec:
  type: NodePort
  selector:
    app: devtrack-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30800
