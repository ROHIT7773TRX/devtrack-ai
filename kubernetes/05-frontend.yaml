---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtrack-frontend
  namespace: devtrack
  labels:
    app: devtrack-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devtrack-frontend
  template:
    metadata:
      labels:
        app: devtrack-frontend
    spec:
      containers:
        - name: frontend
          image: devtrackai/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "150m"

---
apiVersion: v1
kind: Service
metadata:
  name: devtrack-frontend-service
  namespace: devtrack
spec:
  type: NodePort
  selector:
    app: devtrack-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
