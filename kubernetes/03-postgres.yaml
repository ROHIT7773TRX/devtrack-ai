---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: devtrack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devtrack-postgres
  namespace: devtrack
  labels:
    app: devtrack-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devtrack-postgres
  template:
    metadata:
      labels:
        app: devtrack-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: devtrack-secret
            - configMapRef:
                name: devtrack-config
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: devtrack-postgres-service
  namespace: devtrack
spec:
  type: ClusterIP
  selector:
    app: devtrack-postgres
  ports:
    - port: 5432
      targetPort: 5432
