[pytest]
# pytest.ini — pytest configuration file

# Where to look for tests
testpaths = tests

# Show extra info during test runs
addopts =
    -v
    --tb=short
    --no-header

# Test file naming convention — pytest will find files matching this pattern
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore virtual environment
norecursedirs = .venv venv node_modules .git __pycache__
