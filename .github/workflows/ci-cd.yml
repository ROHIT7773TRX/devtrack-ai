name: DevTrack AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────
  # JOB 1: Automated Unit & Integration Testing
  # ──────────────────────────────────────────────
  test:
    name: Run Automated Tests (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/backend/requirements.txt

      - name: Execute Unit & Integration Tests
        run: |
          pytest tests/ -v --cov=app/backend

  # ──────────────────────────────────────────────
  # JOB 2: Build & Push Docker Images
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/backend
          file: ./app/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/devtrack-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME  }}/devtrack-backend:${{ github.sha }}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./app/frontend
          file: ./app/frontend/Dockerfile
          push: true
          build-args: |
            REACT_APP_API_URL=http://${{ secrets.AWS_EC2_PUBLIC_IP }}:30800
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME  }}/devtrack-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/devtrack-frontend:${{ github.sha }}

  # ──────────────────────────────────────────────
  # JOB 3: Deploy to Kubernetes (K3s on AWS EC2)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to K3s on AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Execute Deployment Commands on AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            # Pull latest manifests from git or apply directly
            cd ~/devtrack-ai || git clone https://github.com/${{ github.repository }}.git ~/devtrack-ai
            cd ~/devtrack-ai
            git pull origin main

            # Update Kubernetes secrets & deployment manifests
            kubectl apply -f kubernetes/00-namespace.yaml
            kubectl apply -f kubernetes/01-configmap.yaml
            kubectl apply -f kubernetes/02-secret.yaml
            kubectl apply -f kubernetes/03-postgres.yaml
            kubectl apply -f kubernetes/04-backend.yaml
            kubectl apply -f kubernetes/05-frontend.yaml
            kubectl apply -f kubernetes/06-hpa.yaml
            kubectl apply -f kubernetes/monitoring/

            # Trigger rolling restart to pull newly pushed images
            kubectl rollout restart deployment/devtrack-backend -n devtrack
            kubectl rollout restart deployment/devtrack-frontend -n devtrack

            # Verify deployment status
            kubectl rollout status deployment/devtrack-backend -n devtrack --timeout=60s
            kubectl rollout status deployment/devtrack-frontend -n devtrack --timeout=60s

            # Output running pods summary
            kubectl get pods -n devtrack -o wide
